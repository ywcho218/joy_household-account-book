<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조이쀼의 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#1D2542; --muted:#6A7391; --line:#E2E6F0; --soft:#EEF1F8;
  --accent:#4458CF; --c-fixed:#6B7BDA; --c-food:#F0A068; --c-living:#4DB394; --c-life:#E67A93; --c-etc:#B39AE0;
  --pos:#23906E; --neg:#D2415A; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131728; --surface:#1C2137; --ink:#EEF0F8; --muted:#9AA3C2; --line:#2C3354; --soft:#252B47;
    --accent:#8C9BFF; --c-fixed:#8B99F0; --c-food:#F4B183; --c-living:#6CCBAC; --c-life:#F093A9; --c-etc:#C8B3F0;
    --pos:#58D0A6; --neg:#FF7A90; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131728; --surface:#1C2137; --ink:#EEF0F8; --muted:#9AA3C2; --line:#2C3354; --soft:#252B47;
  --accent:#8C9BFF; --c-fixed:#8B99F0; --c-food:#F4B183; --c-living:#6CCBAC; --c-life:#F093A9; --c-etc:#C8B3F0;
  --pos:#58D0A6; --neg:#FF7A90; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Gowun Dodum","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;margin:0}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1920px;margin:0 auto;padding:22px 16px 56px;display:grid;grid-template-columns:172px minmax(0,1fr);gap:30px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 18px);align-self:start}
.brand{font-family:"Gowun Dodum","IBM Plex Sans KR",sans-serif;font-size:21px;line-height:1.25;margin-bottom:2px}
.brand-year{color:var(--muted);font-size:13px;margin-bottom:18px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{text-decoration:none;padding:7px 12px;border-radius:9px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
nav a:hover{background:var(--soft);color:var(--ink)}
nav a.on{background:var(--ink);color:var(--bg);font-weight:500}
nav a.now::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
nav a.on.now::after{background:var(--bg)}
nav a.first{margin-bottom:8px}
.tools{margin-top:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#131728}

main{min-width:0}
main.narrow{max-width:1020px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:30px;line-height:1.2}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.pager{display:flex;gap:6px}
.btn:disabled{opacity:.4;cursor:default}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:6px 0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:16px 18px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0;padding-left:2px}
.kpi dt{color:var(--muted);font-size:13px}
.kpi dd{margin:2px 0 0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.kpi dd small{font-size:13px;font-weight:400;color:var(--muted);margin-left:2px}
.kpi .sub{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;margin-bottom:18px}
.panel h2{font-size:19px;margin-bottom:2px}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.chartwrap{position:relative}
svg{display:block;width:100%;height:auto}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--muted);font-size:11px}
svg .ax.now{fill:var(--ink);font-weight:600}
svg .inc{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
svg .bar{cursor:pointer;outline:none}
svg .bar:hover rect:not([fill="transparent"]),svg .bar:focus rect:not([fill="transparent"]){opacity:.82}
svg .empty{fill:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.tick{height:3px;border-radius:2px;background:var(--ink);vertical-align:3px;width:14px}
.share{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);margin:10px 0 12px}
.share span{display:block;height:100%}
.sharelist{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 18px;font-size:14px}
.sharelist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--soft);padding:3px 0}
.sharelist i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.sharelist b{font-weight:500}
.sharelist small{color:var(--muted);margin-left:6px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:820px}
.tbl th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--soft);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--soft)}
.tbl tbody tr.now td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tbl tfoot td{font-weight:600;border-bottom:0;border-top:1px solid var(--line)}
.neg{color:var(--neg)}
.pos{color:var(--pos)}
.dim{color:var(--muted)}

/* month */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat.key{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat label,.stat .lb{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;min-height:2.7em}
.stat .v{font-size:21px;font-weight:600;letter-spacing:-.01em}
.stat .v small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:6px}
.stat input{font:inherit;font-size:21px;font-weight:600;width:100%;border:0;background:transparent;color:inherit;padding:0;margin:0;border-bottom:1px dashed var(--line);border-radius:0;text-align:left}
.stat input:focus{outline:none;border-bottom-color:var(--accent)}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr);gap:16px;align-items:start}
.col{display:grid;gap:16px}
.vargrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cc,var(--line));border-radius:14px;padding:12px 14px 10px}
.sec-income{--cc:var(--ink)} .sec-saving{--cc:var(--pos)} .sec-fixed{--cc:var(--c-fixed)}
.sec-food{--cc:var(--c-food)} .sec-living{--cc:var(--c-living)} .sec-life{--cc:var(--c-life)} .sec-etc{--cc:var(--c-etc)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.card-h h3{font-size:16px;line-height:1.3}
.add{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:3px 9px;color:var(--muted);cursor:pointer;font-size:13px;white-space:nowrap}
.add:hover{color:var(--ink);border-color:var(--muted)}
.row{display:grid;gap:4px;align-items:center;border-bottom:1px solid var(--soft)}
.r2{grid-template-columns:minmax(0,1fr) 112px 22px}
.r3{grid-template-columns:minmax(0,1fr) 48px 108px 22px}
.r4{grid-template-columns:22px 36px minmax(0,1fr) 70px 14px;gap:3px}
.row input,.row select{font:inherit;color:inherit;background:transparent;border:0;border-radius:6px;padding:7px 5px;min-width:0;width:100%}
.row select{appearance:none;-webkit-appearance:none;text-align:center;padding-left:0;padding-right:0;cursor:pointer}
.row input:focus,.row select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--soft)}
.row .amt{text-align:right}
.row.ex input,.row.ex .dbtn{opacity:.5;font-style:italic}
.row input::placeholder{color:var(--muted);opacity:.55}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;opacity:.55;padding:4px}
.del:hover{opacity:1;color:var(--neg)}
.card-f{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px;padding-top:6px;font-weight:600}
.card-f span:first-child{color:var(--muted);font-weight:400;font-size:13px}
.card-f .pct{color:var(--muted);font-weight:400;font-size:13px;margin-right:10px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,14,30,.45)}
dialog h2{font-size:19px;margin-bottom:4px}
dialog p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
dialog textarea{width:100%;height:190px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.msg{min-height:1.4em;font-size:13px;margin-top:6px}

@media (max-width:980px){
  .mgrid{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr;gap:14px;padding-top:14px}
  .rail{position:static}
  .brand-year{margin-bottom:10px}
  nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  nav a{flex:0 0 auto;padding:6px 13px;border:1px solid var(--line);background:var(--surface);gap:8px}
  nav a.first{margin-bottom:0}
  nav a.on{border-color:var(--ink)}
  .tools{margin-top:8px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0;padding-left:2px}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .pagehead h1{font-size:25px}
}
@media (max-width:560px){
  .vargrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

[hidden]{display:none!important}
.sync{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.sync.bad{color:var(--neg)}
.tools .btn{margin-bottom:6px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 24px}
.gate-card h1{font-size:26px;margin-bottom:8px}
.gate-card p{margin:0 0 12px}
.gate-card .dim{font-size:13px}
.gate-card label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.gate-card input{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.gate-card input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.gate-card pre{background:var(--soft);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:12.5px;margin:0 0 12px;white-space:pre}
.gate-card .btn{margin-top:14px}
.gmsg{min-height:1.4em;color:var(--neg);font-size:13px;margin-top:8px}

.sheetwrap{container-type:inline-size;container-name:sheet}
.sheet{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.zone{display:grid;gap:12px;align-content:start;min-width:0}
.z3{display:grid;gap:12px;align-items:start;grid-template-columns:repeat(2,minmax(0,1fr))}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@container sheet (max-width:519px){.z3,.pair{grid-template-columns:minmax(0,1fr)}}
@container sheet (min-width:720px){
  .sheet{grid-template-columns:230px 280px minmax(0,1fr)}
  .z3{grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
}
@container sheet (min-width:1560px){
  .z3{grid-column:auto;grid-template-columns:repeat(4,minmax(0,1fr))}
}
.pay{border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:50%;width:22px;height:22px;padding:0;font-size:11px;line-height:1;cursor:pointer}
.pay[data-p="옹"]{background:var(--c-fixed);border-color:transparent;color:var(--bg)}
.pay[data-p="답"]{background:var(--c-life);border-color:transparent;color:var(--bg)}

/* 데스크톱: 왼쪽 메뉴를 위로 올리고 월별 화면을 약 1900px 폭으로 */
@media (min-width:821px){
  .app{max-width:none;grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 14px 56px}
  .rail{position:static;display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap}
  .brand{margin:0;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .brand br{display:none}
  .brand-year{margin:0}
  nav{flex-direction:row;flex-wrap:wrap;gap:4px;flex:1 1 auto}
  nav a{padding:6px 12px;gap:8px}
  nav a.first{margin:0 8px 0 0}
  .tools{margin:0 0 0 auto;display:flex;align-items:center;gap:8px}
  .tools .btn{margin:0}
  .sync{margin:0 6px 0 0}
  main.narrow{max-width:1100px;margin:0 auto;width:100%}
  .sheetwrap{overflow-x:auto;container-type:normal}
  .sheet{grid-template-columns:240px 300px minmax(0,1fr);min-width:1860px}
  .z3{grid-column:auto;grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* 연도 선택 */
.yearbox{display:flex;align-items:center;gap:6px;margin-bottom:18px}
.yearsel{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
.dlabel{display:block;font-size:13px;color:var(--muted);margin:6px 0 4px}
dialog input[type=number]{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
@media (max-width:820px){.yearbox{margin-bottom:10px}}
@media (min-width:821px){.yearbox{margin:0}}
/* 항목 글꼴 2단계 축소 */
.row input,.row select{font-size:13px;padding:6px 5px}
.card-h h3{font-size:14px}
.add{font-size:12px}
.card-f{font-size:13px}
.card-f span:first-child,.card-f .pct{font-size:12px}
.stat label,.stat .lb{font-size:12px}

/* 날짜: 달력으로 선택 */
.dwrap{position:relative;display:block;min-width:0}
.dbtn{width:100%;border:0;background:transparent;color:inherit;font:inherit;font-size:13px;padding:6px 2px;text-align:left;cursor:pointer;border-radius:6px;white-space:nowrap}
.card-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dbtn:hover{background:var(--soft)}
.dbtn.empty{color:var(--muted);opacity:.7}
.row .dinput{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;border:0;padding:0}

/* ===== 모바일 가시성 개선 (폭 720px 이하) ===== */
@media (max-width:720px){
  body{font-size:16px}
  .app{padding:12px 12px 48px;grid-template-columns:minmax(0,1fr)}
  .rail,nav,main{min-width:0}
  /* 헤더: 제목+연도 한 줄, 월 메뉴는 그 아래 */
  .rail{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
  .brand{display:flex;align-items:baseline;margin:0;font-size:20px}
  .brand br{display:none}
  .yearbox{margin:0 0 0 auto}
  .yearsel,.btn{min-height:40px}
  nav{flex:1 1 100%;gap:8px;padding-bottom:8px}
  nav a{padding:9px 15px;font-size:15px;min-height:40px}
  .tools{flex:1 1 100%;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tools .btn{margin:0}
  .sync{margin:0 auto 0 0}
  .pagehead h1{font-size:22px}
  .pager .btn{padding:8px 14px}

  /* 핵심 수치(비상금·지출)를 맨 위에 2열로 */
  .sheet{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .zone{display:contents}
  .card,.z3{grid-column:1/-1}
  .stat{order:-1;padding:12px}
  .stat.key{order:-2;grid-column:1/-1}
  .stat.key .v{font-size:26px}
  .stat .v{font-size:19px}
  .stat label,.stat .lb{font-size:13px;min-height:0;margin-bottom:2px}
  .stat input{font-size:19px}

  /* 카드 */
  .card{padding:12px 12px 10px}
  .card-h{margin-bottom:8px}
  .card-h h3{font-size:17px}
  .add{font-size:14px;padding:8px 12px;min-height:38px}
  .card-f{font-size:16px;margin-top:10px}
  .card-f span:first-child,.card-f .pct{font-size:13px}

  /* 입력 행: 16px 글꼴(iOS 확대 방지), 넉넉한 터치 영역 */
  .row input,.row select{font-size:16px;padding:10px 6px;min-height:44px}
  .row .amt{font-weight:500}
  .del{font-size:22px;padding:6px;min-width:34px;min-height:44px}
  .pay{width:30px;height:30px;font-size:13px}
  .dbtn{font-size:15px;padding:10px 2px;min-height:44px}
  .row{padding:2px 0}

  /* 수입·저축: 한 줄 */
  .r2{grid-template-columns:minmax(0,1fr) 124px 34px}
  /* 고정지출: 이름 한 줄 + (결제자, 금액) 한 줄 */
  .r3{grid-template-columns:64px minmax(0,1fr) 34px;grid-template-areas:"name name del" "payer amt amt";gap:0 4px}
  .r3 input[data-f="name"]{grid-area:name}
  .r3 select{grid-area:payer;border:1px solid var(--line);background:var(--soft);margin:2px 0 6px}
  .r3 .amt{grid-area:amt;margin:2px 0 6px}
  .r3 .del{grid-area:del}
  /* 변동지출: 내용 한 줄 + 금액 한 줄 (내용이 잘리지 않게) */
  .r4{grid-template-columns:34px 56px minmax(0,1fr) 34px;grid-template-areas:"pay day desc del" "pay day amt del";gap:0 4px}
  .r4 .pay{grid-area:pay;align-self:center;justify-self:center}
  .r4 .dwrap{grid-area:day;align-self:center}
  .r4 input[data-f="desc"]{grid-area:desc}
  .r4 .amt{grid-area:amt;margin-bottom:6px}
  .r4 .del{grid-area:del;align-self:center}

  /* 종합 현황 */
  .kpis{margin-bottom:14px}
  .kpi dd{font-size:21px}
  .panel{padding:14px 12px 10px}
  .legend{font-size:14px;gap:6px 14px}
  .sharelist{font-size:15px}
  .tbl{min-width:760px}
  .tbl td,.tbl th{padding:10px 9px;font-size:14px}
}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand">조이쀼의<br>가계부</div>
    <div class="yearbox"><select id="yearSel" class="yearsel" aria-label="연도 선택"></select><button class="btn" id="yearAdd" type="button">연도 추가</button></div>
    <nav id="nav" aria-label="월 선택"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
/* ====== 여기에 Supabase 프로젝트 값을 넣으세요 (Project Settings > API) ====== */
var SUPABASE_URL="https://tkfbzihbitroqqvvylhj.supabase.co";
var SUPABASE_ANON_KEY="sb_publishable_jWtC3nblSCcKTyV-p8lTkQ_n_X0JJnH";
/* service_role key는 절대 넣지 마세요. anon public key만 사용해요. */

var YEAR=new Date().getFullYear(), years=[];
var SECS={income:"수입",saving:"저축",fixed:"고정지출",food:"식비/외식비",living:"생필품비",life:"교통/유류/통신/교육/문화/병원비",etc:"기타"};
var VARS=["food","living","life","etc"];
var ALL=["income","saving","fixed","food","living","life","etc"];
var NOW=new Date(), curM=NOW.getFullYear()===YEAR?NOW.getMonth()+1:0;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function won(n){return n===0?"-":(n<0?"-":"")+Math.abs(n).toLocaleString("ko-KR")}
function fmtIn(n){return n?Number(n).toLocaleString("ko-KR"):""}
function newId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16)});
}
function emptyMonth(){return {income:[],saving:[],fixed:[],food:[],living:[],life:[],etc:[],avail:0,baby:0}}
var S={months:{}};
(function(){for(var m=1;m<=12;m++)S.months[m]=emptyMonth()})();

/* 내용이 "[제외]"로 시작하는 행은 금액은 보이지만 합계·지출 계산에서 빠진다 */
function isEx(x){return !!x.desc&&x.desc.indexOf("[제외]")===0}
function sum(a){return a.reduce(function(s,x){return s+(isEx(x)?0:(+x.amt||0))},0)}
function calc(m){
  var d=S.months[m], r={inc:sum(d.income),sav:sum(d.saving),fix:sum(d.fixed)};
  VARS.forEach(function(k){r[k]=sum(d[k])});
  r.exp=r.fix+VARS.reduce(function(s,k){return s+r[k]},0);
  r.room=r.inc-r.sav-r.exp;
  var all=d.fixed.concat(d.food,d.living,d.life,d.etc);
  function paid(p){return all.filter(function(x){return x.payer===p&&!isEx(x)}).reduce(function(s,x){return s+(+x.amt||0)},0)}

}
function pc(x,inc){return inc>0?(x/inc*100).toFixed(1)+"%":"-"}

/* ---------- Supabase 데이터 계층 ---------- */
var sb=null, HH=null;
var dirty={}, dels={}, metaDirty={}, timer=null, flushing=false, again=false;

function setStatus(text,bad){
  var el=document.getElementById("sync");
  if(!el)return;
  el.textContent=text;el.classList.toggle("bad",!!bad);
}
function configured(){return SUPABASE_URL.indexOf("YOUR-PROJECT")<0&&SUPABASE_ANON_KEY.indexOf("YOUR-ANON")<0}
function isVar(sec){return VARS.indexOf(sec)>=0}
function findItem(id){
  for(var m=1;m<=12;m++){
    var d=S.months[m];
    for(var i=0;i<ALL.length;i++){
      var l=d[ALL[i]];
      for(var j=0;j<l.length;j++)if(l[j].id===id)return l[j];
    }
  }
  return null;
}
function toRow(it){
  var v=isVar(it._s);
  return {id:it.id,household_id:HH,year:it._y||YEAR,month:it._m,section:it._s,
    label:v?(it.desc||""):(it.name||""),day:v?(it.day||null):null,
    amount:Math.round(+it.amt||0),payer:it.payer||null,sort_order:it.order||0};
}
function mkItem(m,sec,o){
  o=o||{};
  return {id:o.id||newId(),name:o.name||"",desc:o.desc||"",day:o.day||"",amt:+o.amt||0,payer:o.payer||"",order:o.order||0,_m:m,_s:sec,_y:YEAR};
}
function schedule(){setStatus("저장 중…");clearTimeout(timer);timer=setTimeout(flush,600)}
function markDirty(id){dirty[id]=true;schedule()}
function markMeta(m){metaDirty[m]=true;schedule()}
function hasPending(){return flushing||Object.keys(dirty).length>0||Object.keys(dels).length>0||Object.keys(metaDirty).length>0}

async function flush(){
  if(flushing){again=true;return}
  var ids=Object.keys(dirty), dl=Object.keys(dels), ms=Object.keys(metaDirty);
  if(!ids.length&&!dl.length&&!ms.length)return;
  flushing=true;
  var bad=false;
  dirty={};dels={};metaDirty={};
  try{
    var rows=[];
    ids.forEach(function(id){var it=findItem(id);if(it)rows.push(toRow(it))});
    if(rows.length){var r=await sb.from("entries").upsert(rows,{onConflict:"id"});if(r.error)throw r.error}
  }catch(e){bad=true;ids.forEach(function(id){dirty[id]=true})}
  try{
    if(dl.length){var r2=await sb.from("entries").delete().in("id",dl);if(r2.error)throw r2.error}
  }catch(e){bad=true;dl.forEach(function(id){dels[id]=true})}
  try{
    for(var i=0;i<ms.length;i++){
      var m=+ms[i], d=S.months[m];
      var r3=await sb.from("month_meta").upsert({household_id:HH,year:YEAR,month:m,avail:Math.round(d.avail||0),baby_savings:Math.round(d.baby||0)},{onConflict:"household_id,year,month"});
      if(r3.error)throw r3.error;
    }
  }catch(e){bad=true;ms.forEach(function(m){metaDirty[m]=true})}
  flushing=false;
  clearTimeout(timer);
  if(bad){setStatus("저장 실패. 5초 뒤 다시 시도해요",true);timer=setTimeout(flush,5000)}
  else if(again||hasPending()){again=false;timer=setTimeout(flush,300)}
  else setStatus("저장됨");
}

async function fetchEntries(){
  var all=[], from=0, size=1000;
  for(;;){
    var r=await sb.from("entries").select("*").eq("household_id",HH).eq("year",YEAR)
      .order("sort_order",{ascending:true}).order("created_at",{ascending:true}).order("id",{ascending:true})
      .range(from,from+size-1);
    if(r.error)throw r.error;
    all=all.concat(r.data);
    if(r.data.length<size)break;
    from+=size;
  }
  return all;
}
async function loadAll(){
  var rows=await fetchEntries();
  var mt=await sb.from("month_meta").select("*").eq("household_id",HH).eq("year",YEAR);
  if(mt.error)throw mt.error;
  var months={};
  for(var m=1;m<=12;m++)months[m]=emptyMonth();
  rows.forEach(function(r){
    var d=months[r.month];
    if(!d||!d[r.section])return;
    var v=isVar(r.section);
    d[r.section].push(mkItem(r.month,r.section,{id:r.id,name:v?"":r.label,desc:v?r.label:"",day:r.day,amt:Number(r.amount),payer:r.payer,order:r.sort_order}));
  });
  mt.data.forEach(function(r){
    if(months[r.month]){months[r.month].avail=Number(r.avail)||0;months[r.month].baby=Number(r.baby_savings)||0}
  });
  S.months=months;
  return rows.length;
}

    .forEach(function(f,i){add("fixed",f[0],f[1],f[2],i)});

/* ---------- month view ---------- */
function dayPicker(x){
  var m=x._m||1, y=x._y||YEAR, last=new Date(y,m,0).getDate(), mm=("0"+m).slice(-2);
  var dn=parseInt(x.day,10), has=dn>=1&&dn<=last;

    +'<input type="date" class="dinput" tabindex="-1" aria-hidden="true" min="'+y+'-'+mm+'-01" max="'+y+'-'+mm+'-'+("0"+last).slice(-2)+'" value="'+y+'-'+mm+'-'+("0"+def).slice(-2)+'"></span>';

function rowHTML(sec,x){

function keyOf(sec){return sec==="income"?"inc":sec==="saving"?"sav":sec==="fixed"?"fix":sec}
function cardHTML(sec,d){

function monthView(m){
  var d=S.months[m];

  var room='<div class="stat key"><span class="lb">이달의 비상금<br>수입 − 저축 − 지출</span><div class="v" data-bind="room"></div></div>';

  return '<div class="pagehead"><div><h1>'+YEAR+'년 '+m+'월 〈조이쀼의 가계부〉</h1></div>'

/* 전월 고정지출 복사: 항목명·결제자·금액을 그대로 가져온다. 1월은 전년 12월에서 가져온다. */
async function copyFixed(m){
  var src, prevLabel=(m>1?m-1:12)+"월";
  try{
    if(m>1){
      src=S.months[m-1].fixed.map(function(x){return {name:x.name,payer:x.payer,amt:+x.amt||0}});
    }else{
      var r=await sb.from("entries").select("label,payer,amount").eq("household_id",HH).eq("year",YEAR-1).eq("month",12).eq("section","fixed")
        .order("sort_order",{ascending:true}).order("created_at",{ascending:true});
      if(r.error)throw r.error;
      src=r.data.map(function(x){return {name:x.label||"",payer:x.payer||"",amt:Number(x.amount)||0}});
    }
  }catch(e){alert("전월 고정지출을 불러오지 못했어요.");return}
  if(cur!==m)return;
  if(!src.length){alert((m>1?prevLabel:(YEAR-1)+"년 "+prevLabel)+"에 고정지출이 없어요.");return}
  var d=S.months[m];
  var msg=d.fixed.length
    ?m+"월 고정지출 "+d.fixed.length+"개를 지우고 "+prevLabel+" 내용("+src.length+"개)으로 바꿀까요?"
    :prevLabel+" 고정지출 "+src.length+"개를 "+m+"월에 복사할까요?";
  if(!confirm(msg))return;
  d.fixed.forEach(function(x){delete dirty[x.id];dels[x.id]=true});
  d.fixed=src.map(function(s,i){
    var it=mkItem(m,"fixed",{name:s.name.replace(/^\d{1,2}월(?=\s*대출)/,m+"월"),payer:s.payer,amt:s.amt,order:i});
    dirty[it.id]=true;return it;
  });
  schedule();render();
}
function refresh(){
  var r=calc(cur), inc=r.inc, map={};
  ["inc","sav","fix","food","living","life","etc","exp","room","sendO","sendD"].forEach(function(k){map[k]=won(r[k])});
  ["sav","fix","food","living","life","etc","exp"].forEach(function(k){map[k+"P"]=pc(r[k],inc)});
  map.expP=inc>0?"수입의 "+pc(r.exp,inc):"";

}

/* ---------- overview ---------- */
function chartSVG(R){
  var mob=window.innerWidth<=560;
  var W=mob?380:760,H=mob?250:300,L=mob?50:54,Rr=12,T=14,B=30,pw=W-L-Rr,ph=H-T-B;
  var max=Math.max.apply(null,R.map(function(r){return Math.max(r.exp,r.inc)}));
  var empty=max===0; if(empty)max=1000000;
  var raw=max/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
  var step=(n<=1?1:n<=2?2:n<=5?5:10)*mag, steps=Math.ceil(max/step), top=step*steps;
  function y(v){return T+ph-(v/top)*ph}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="월별 지출 구성과 수입 차트">';
  for(var i=0;i<=steps;i++){
    var v=step*i;
    s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(v)+'" y2="'+y(v)+'" class="grid"/>'
      +'<text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end" class="ax">'+(v===0?"0":(v/10000).toLocaleString("ko-KR")+"만")+'</text>';
  }
  var sw=pw/12, bw=Math.min(34,sw*.58);
  var parts=[["fix","--c-fixed"],["food","--c-food"],["living","--c-living"],["life","--c-life"],["etc","--c-etc"]];
  R.forEach(function(r,i){
    var m=i+1, cx=L+sw*i+sw/2, x=cx-bw/2, acc=0;
    s+='<g class="bar" data-go="m'+m+'" tabindex="0" role="link" aria-label="'+m+'월 가계부 열기"><title>'+m+'월 수입 '+won(r.inc)+' / 지출 '+won(r.exp)+' / 비상금 '+won(r.room)+'</title>'
      +'<rect x="'+(L+sw*i)+'" y="'+T+'" width="'+sw+'" height="'+ph+'" fill="transparent"/>';
    parts.forEach(function(p){
      var val=r[p[0]];
      if(val>0){var y1=y(acc+val), y0=y(acc);
        s+='<rect x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(y0-y1,0)+'" style="fill:var('+p[1]+');stroke:var(--surface);stroke-width:1"/>';
        acc+=val}
    });
    if(r.inc>0)s+='<line class="inc" x1="'+(x-5)+'" x2="'+(x+bw+5)+'" y1="'+y(r.inc)+'" y2="'+y(r.inc)+'"/>';
    s+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" class="ax'+(m===curM?" now":"")+'">'+m+'월</text></g>';
  });
  if(empty)s+='<text class="empty" x="'+(L+pw/2)+'" y="'+(T+ph/2)+'" text-anchor="middle">월별 탭에 금액을 입력하면 차트가 채워져요</text>';
  return s+'</svg>';
}

     +'<div class="sharelist">'+items.map(function(it){return '<div><span><i style="background:var('+it[2]+')"></i>'+it[0]+'</span><span><b>'+won(it[1])+'</b><small>'+(it[1]>0?(it[1]/T.exp*100).toFixed(1)+"%":"")+'</small></span></div>'}).join("")+'</div>'

    +'<dl class="kpis">'

      +'<div class="kpi"><dt>비상금 누적</dt><dd class="'+(T.room<0?"neg":T.room>0?"pos":"")+'">'+u(T.room)+'<span class="sub">수입 − 저축 − 지출</span></dd></div>'
    +'</dl>'
    +'<section class="panel"><h2>월별 수입과 지출</h2><p class="hint">막대는 지출 구성, 검은 선은 그 달의 수입이에요.</p>'
      +'<div class="chartwrap">'+chartSVG(R)+'</div>'
      +'<div class="legend">'+items.map(function(it){return '<span><i style="background:var('+it[2]+')"></i>'+it[0]+'</span>'}).join("")+'<span><i class="tick"></i>수입</span></div></section>'
    +'<section class="panel"><h2>올해 지출은 어디에 썼을까</h2><p class="hint">12개월 지출 합계 기준이에요.</p>'+share+'</section>'
    +'<section class="panel"><h2>월별 한눈에 보기</h2><div class="scroll"><table class="tbl"><thead><tr><th>월</th><th>수입</th><th>저축</th><th>고정지출</th><th>식비/외식비</th><th>생필품비</th><th>교통/문화/병원 등</th><th>기타</th><th>총 지출</th><th>비상금</th><th>저축률</th></tr></thead><tbody>'+rows+'</tbody>'
      +'<tfoot><tr><td>합계</td><td>'+won(T.inc)+'</td><td>'+won(T.sav)+'</td><td>'+won(T.fix)+'</td><td>'+won(T.food)+'</td><td>'+won(T.living)+'</td><td>'+won(T.life)+'</td><td>'+won(T.etc)+'</td><td>'+won(T.exp)+'</td><td class="'+(T.room<0?"neg":T.room>0?"pos":"")+'">'+won(T.room)+'</td><td>'+rate+'</td></tr></tfoot></table></div></section>';

/* ---------- shell ---------- */
var main=document.getElementById("main"), navEl=document.getElementById("nav"), gate=document.getElementById("gate"), appEl=document.getElementById("app");
function parseHash(){
  var h=location.hash.slice(1), mm=/^(?:(\d{4})-)?(?:(summary)|m(\d{1,2}))$/.exec(h);
  var y=YEAR, v="summary";
  if(mm){
    if(mm[1]){var yy=+mm[1];if(yy>=2000&&yy<=2100)y=yy}
    if(mm[3]){var n=+mm[3];if(n>=1&&n<=12)v=n}
  }
  return {y:y,v:v};
}
function recalcCurM(){curM=NOW.getFullYear()===YEAR?NOW.getMonth()+1:0}
function yearList(){
  var set={};
  years.forEach(function(y){set[y]=1});
  set[YEAR]=1;set[NOW.getFullYear()]=1;
  return Object.keys(set).map(Number).sort(function(a,b){return b-a});
}
function renderYearSel(){
  var sel=document.getElementById("yearSel");
  if(!sel)return;
  sel.innerHTML=yearList().map(function(y){return '<option value="'+y+'"'+(y===YEAR?" selected":"")+'>'+y+'년</option>'}).join("");
}
async function loadYears(){
  try{
    var r=await sb.from("monthly_summary").select("year").eq("household_id",HH);
    if(r.error)throw r.error;
    var set={};
    r.data.forEach(function(x){set[x.year]=1});
    years=Object.keys(set).map(Number);
  }catch(e){}
}
async function flushAll(){
  for(var i=0;i<4;i++){
    clearTimeout(timer);
    while(flushing)await new Promise(function(r){setTimeout(r,80)});
    if(!hasPending())return true;
    await flush();
  }
  return !hasPending();
}
async function switchYear(y){
  setStatus("불러오는 중…");
  var ok=await flushAll();
  if(!ok){setStatus("저장 실패. 잠시 후 다시 시도해 주세요",true);return false}
  var prev=YEAR;
  try{
    YEAR=y;recalcCurM();
    var n=await loadAll();
    if(n===0&&!wasSeeded()){await seed();setSeeded();await loadAll()}
    else if(n>0){setSeeded()}
    await loadYears();
    setStatus("저장됨");
    return true;
  }catch(e){
    YEAR=prev;recalcCurM();
    try{await loadAll()}catch(e2){}
    setStatus("연도를 불러오지 못했어요",true);
    return false;
  }
}
function navHTML(){
  var h='<a class="first'+(cur==="summary"?" on":"")+'" href="#'+YEAR+'-summary"'+(cur==="summary"?' aria-current="page"':"")+'>종합 현황</a>';
  for(var m=1;m<=12;m++){
    h+='<a class="'+(cur===m?"on":"")+(m===curM?" now":"")+'" href="#'+YEAR+'-m'+m+'"'+(cur===m?' aria-current="page"':"")+'>'+m+'월</a>';
  }
  return h;
}
function render(){
  cur=parseHash().v;
  renderYearSel();
  navEl.innerHTML=navHTML();
  main.className=cur==="summary"?"narrow":"";
  main.innerHTML=cur==="summary"?summaryView():monthView(cur);
  if(cur!=="summary")refresh();
}
var hashBusy=false, hashAgain=false;
async function onHash(){
  if(appEl.hidden)return;
  if(hashBusy){hashAgain=true;return}
  hashBusy=true;
  try{
    var h=parseHash();
    if(h.y!==YEAR){
      var ok=await switchYear(h.y);
      if(!ok)location.replace("#"+YEAR+"-"+(cur==="summary"?"summary":"m"+cur));
    }
    render();window.scrollTo(0,0);
  }finally{
    hashBusy=false;
    if(hashAgain){hashAgain=false;onHash()}
  }
}
window.addEventListener("hashchange",onHash);

function showGate(kind,msg){
  appEl.hidden=true;gate.hidden=false;
  var h='<div class="gate-card"><h1>조이쀼의 가계부</h1>';
  if(kind==="setup"){
    h+='<p>Supabase 연결 정보를 먼저 넣어야 해요. 이 파일 위쪽 스크립트에서 아래 두 값을 내 프로젝트 값으로 바꿔 주세요.</p>'
      +'<pre>var SUPABASE_URL="...";\nvar SUPABASE_ANON_KEY="...";</pre>'
      +'<p class="dim">Supabase 대시보드의 Project Settings &gt; API에서 Project URL과 anon public key를 확인할 수 있어요. service_role key는 넣지 마세요.</p>';
  }else if(kind==="login"){
    h+='<p class="dim">공용 계정으로 로그인해 주세요.</p>'
      +'<form><label for="g-email">이메일</label><input id="g-email" name="email" type="email" autocomplete="username" required>'
      +'<label for="g-pw">비밀번호</label><input id="g-pw" name="password" type="password" autocomplete="current-password" required>'
      +'<div class="gmsg" role="alert"></div><button class="btn primary" type="submit">로그인</button></form>';
  }else if(kind==="nohh"){
    h+='<p>이 계정은 아직 가계부에 연결되지 않았어요. Supabase SQL Editor에서 아래를 실행한 뒤 새로고침해 주세요. 이메일은 이 계정의 이메일로 바꿔야 해요.</p>'
      +'<pre>'+esc("with h as (\n  insert into public.households (name)\n  values ('조이쀼의 가계부') returning id\n)\ninsert into public.household_members (household_id, user_id)\nselect h.id, u.id from h, auth.users u\nwhere u.email = '공용계정@이메일';")+'</pre>'
      +'<button class="btn" type="button" id="g-reload">새로고침</button> <button class="btn" type="button" id="g-out">로그아웃</button>';
  }else{
    h+='<p>'+esc(msg||"문제가 생겼어요.")+'</p><button class="btn" type="button" id="g-reload">다시 시도</button>';
  }
  gate.innerHTML=h+'</div>';
  var f=gate.querySelector("form");
  if(f)f.addEventListener("submit",async function(e){
    e.preventDefault();
    var btn=f.querySelector("button"), box=gate.querySelector(".gmsg");
    btn.disabled=true;box.textContent="";
    var r;
    try{r=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.password.value})}catch(err){r={error:err}}
    btn.disabled=false;
    if(r.error){box.textContent="이메일 또는 비밀번호가 맞지 않아요.";return}
    start();
  });
  var rl=document.getElementById("g-reload");if(rl)rl.addEventListener("click",function(){location.reload()});
  var go=document.getElementById("g-out");if(go)go.addEventListener("click",signOut);
}
function hideGate(){gate.hidden=true;gate.innerHTML="";appEl.hidden=false}
async function signOut(){
  try{await flush()}catch(e){}
  try{await sb.auth.signOut()}catch(e){}
  location.reload();
}

async function start(){
  try{
    setStatus("불러오는 중…");
    var r=await sb.from("household_members").select("household_id").limit(1);
    if(r.error)throw r.error;
    if(!r.data||!r.data.length){showGate("nohh");return}
    HH=r.data[0].household_id;
    YEAR=parseHash().y;recalcCurM();
    var n=await loadAll();
    if(n===0&&!wasSeeded()){await seed();setSeeded();await loadAll()}
    else if(n>0){setSeeded()}
    await loadYears();
    hideGate();render();setStatus("저장됨");
  }catch(e){
    showGate("error","데이터를 불러오지 못했어요. 네트워크와 Supabase 설정을 확인해 주세요. ("+(e&&e.message?e.message:"알 수 없는 오류")+")");
  }
}

function boot(){
  if(!configured()){showGate("setup");return}
  if(!window.supabase){showGate("error","Supabase 라이브러리를 불러오지 못했어요. 네트워크를 확인해 주세요.");return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.auth.getSession().then(function(r){
    if(r.data&&r.data.session)start();else showGate("login");
  }).catch(function(){showGate("login")});
}

main.addEventListener("input",function(e){
  var t=e.target;
  if(cur==="summary")return;
  var top=t.getAttribute("data-top"), f=t.getAttribute("data-f");
  if(t.classList.contains("amt")){
    var digits=t.value.replace(/\D/g,"");
    var num=digits?parseInt(digits,10):0;
    t.value=digits?num.toLocaleString("ko-KR"):"";
    if(top){S.months[cur][top]=num;markMeta(cur);return}
    var rowEl=t.closest("[data-id]");
    if(!rowEl)return;
    var item=S.months[cur][rowEl.getAttribute("data-sec")].filter(function(x){return x.id===rowEl.getAttribute("data-id")})[0];
    if(item){item.amt=num;markDirty(item.id);refresh()}
    return;
  }
  if(f){
    var row=t.closest("[data-id]");
    if(!row)return;
    var it=S.months[cur][row.getAttribute("data-sec")].filter(function(x){return x.id===row.getAttribute("data-id")})[0];
    if(it){it[f]=t.value;markDirty(it.id);if(f==="payer")refresh();if(f==="desc"){row.classList.toggle("ex",isEx(it));refresh()}}
  }
});
main.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");
  if(b){
    if(cur==="summary")return;
    var act=b.getAttribute("data-act"), d=S.months[cur];
    if(act==="add"){
      var sec=b.getAttribute("data-sec");
      var order=d[sec].reduce(function(mx,x){return Math.max(mx,x.order||0)},-1)+1;
      var it=mkItem(cur,sec,{order:order});
      if(isVar(sec)&&NOW.getFullYear()===YEAR&&NOW.getMonth()+1===cur)it.day=NOW.getDate()+"일";
      d[sec].push(it);markDirty(it.id);render();
      var first=main.querySelector('[data-id="'+it.id+'"] input[data-f="desc"],[data-id="'+it.id+'"] input[data-f="name"]');
      if(first)first.focus();
    }else if(act==="pick"){
      var inp=b.closest(".dwrap").querySelector(".dinput");
      try{if(inp.showPicker)inp.showPicker();else{inp.focus();inp.click()}}catch(err){inp.focus();inp.click()}
    }else if(act==="pay"){
      var prow=b.closest("[data-id]"), psc=prow.getAttribute("data-sec"), pid=prow.getAttribute("data-id");
      var pit=d[psc].filter(function(x){return x.id===pid})[0];
      if(pit){
        var cyc=["","옹","답"];
        pit.payer=cyc[(cyc.indexOf(pit.payer)+1)%3];
        b.textContent=pit.payer||"-";b.setAttribute("data-p",pit.payer);
        markDirty(pit.id);refresh();
      }
    }else if(act==="copyfix"){
      copyFixed(cur);
    }else if(act==="del"){
      var row=b.closest("[data-id]"), sc=row.getAttribute("data-sec"), id=row.getAttribute("data-id");
      d[sc]=d[sc].filter(function(x){return x.id!==id});
      delete dirty[id];dels[id]=true;schedule();render();
    }
    return;
  }
  var g=e.target.closest("[data-go]");
  if(g&&!g.disabled){location.hash=YEAR+"-"+g.getAttribute("data-go")}
});
main.addEventListener("change",function(e){
  var t=e.target;
  if(!t.classList.contains("dinput"))return;
  var row=t.closest("[data-id]"), mt=/^\d{4}-\d{2}-(\d{2})$/.exec(t.value);
  if(!row||!mt)return;
  var item=S.months[cur][row.getAttribute("data-sec")].filter(function(x){return x.id===row.getAttribute("data-id")})[0];
  if(!item)return;
  item.day=parseInt(mt[1],10)+"일";
  var btn=row.querySelector(".dbtn");
  btn.textContent=item.day;btn.classList.remove("empty");
  markDirty(item.id);
});
main.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var g=e.target.closest("tr[data-go],g[data-go]");
  if(g)location.hash=YEAR+"-"+g.getAttribute("data-go");
});

/* 백업 / 복원 */
var bk=document.getElementById("bk"), bkText=document.getElementById("bkText"), bkMsg=document.getElementById("bkMsg"), bkRestore=document.getElementById("bkRestore");
var armed=false;
function disarm(){armed=false;bkRestore.textContent="이 내용으로 복원"}
function exportJSON(){
  var out={app:"gagyebu",year:YEAR,months:{}};
  for(var m=1;m<=12;m++){
    var d=S.months[m], o={avail:d.avail,baby:d.baby};
    ALL.forEach(function(k){o[k]=d[k].map(function(x){return {name:x.name,desc:x.desc,day:x.day,amt:x.amt,payer:x.payer}})});
    out.months[m]=o;
  }
  return JSON.stringify(out);
}
function importMonths(obj){
  if(!obj||!obj.months)throw new Error("형식 오류");
  var months={};
  for(var m=1;m<=12;m++){
    var src=obj.months[m]||{}, d=emptyMonth();
    ALL.forEach(function(k){
      var l=Array.isArray(src[k])?src[k]:[];
      d[k]=l.map(function(x,i){return mkItem(m,k,{name:x.name,desc:x.desc,day:x.day,amt:x.amt,payer:x.payer,order:i})});
    });
    d.avail=+src.avail||0;d.baby=+src.baby||0;
    months[m]=d;
  }
  return months;
}
document.getElementById("bkBtn").addEventListener("click",function(){
  bkText.value=exportJSON();bkMsg.textContent="";bkMsg.className="msg";disarm();
  if(bk.showModal)bk.showModal();else bk.setAttribute("open","");
});
document.getElementById("bkClose").addEventListener("click",function(){bk.close()});
document.getElementById("bkCopy").addEventListener("click",function(){
  bkText.focus();bkText.select();
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  bkMsg.className="msg";bkMsg.textContent=ok?"복사했어요.":"전체 선택됐어요. 길게 눌러 복사해 주세요.";
});
bkText.addEventListener("input",disarm);
bkRestore.addEventListener("click",function(){
  var months;
  try{months=importMonths(JSON.parse(bkText.value))}
  catch(e){bkMsg.className="msg neg";bkMsg.textContent="복원할 수 없어요. 백업 내용을 처음부터 끝까지 그대로 붙여 넣었는지 확인해 주세요.";disarm();return}
  if(!armed){armed=true;bkRestore.textContent="정말 복원할까요?";bkMsg.className="msg neg";bkMsg.textContent="지금 DB의 "+YEAR+"년 내용이 모두 이 내용으로 바뀌어요.";return}
  for(var m=1;m<=12;m++){
    ALL.forEach(function(k){
      S.months[m][k].forEach(function(x){delete dirty[x.id];dels[x.id]=true});
    });
  }
  S.months=months;
  for(var mm=1;mm<=12;mm++){
    ALL.forEach(function(k){S.months[mm][k].forEach(function(x){dirty[x.id]=true})});
    metaDirty[mm]=true;
  }
  schedule();render();disarm();bk.close();
});
document.getElementById("outBtn").addEventListener("click",signOut);

window.addEventListener("beforeunload",function(e){
  if(hasPending()){e.preventDefault();e.returnValue=""}
});
document.addEventListener("visibilitychange",async function(){
  if(!HH||appEl.hidden)return;
  if(document.visibilityState==="hidden"){clearTimeout(timer);flush();return}
  var a=document.activeElement;
  if(hasPending()||(a&&main.contains(a)&&/INPUT|SELECT/.test(a.tagName)))return;

});

  location.hash=y+"-"+(cur==="summary"?"summary":"m"+cur);
});

yIn.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();document.getElementById("yOk").click()}});

boot();
