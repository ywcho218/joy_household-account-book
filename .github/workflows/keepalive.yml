# 무료 Supabase 프로젝트가 한동안 접속이 없어 일시정지되지 않도록, 주 2회 DB에 조회 요청을 보냅니다.
# 프로젝트가 멈췄거나 장애가 있으면 이 작업이 실패로 표시되고 GitHub가 메일로 알려 줍니다.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        run: |
          URL="https://tkfbzihbitroqqvvylhj.supabase.co/rest/v1/app_kv?select=key&limit=1"
          KEY="sb_publishable_jWtC3nblSCcKTyV-p8lTkQ_n_X0JJnH"
          code=$(curl -s -m 30 -o body.txt -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL")
          echo "Supabase status: $code"
          head -c 300 body.txt; echo
          if [ "$code" = "200" ]; then exit 0; fi
          # 로그인 없는 요청이라 'permission denied'(42501)가 오는 것도 DB가 깨어 응답했다는 뜻이라 정상으로 본다
          if [ "$code" = "401" ] && grep -q 42501 body.txt; then echo "DB responded (permission denied is expected)"; exit 0; fi
          exit 1
